services:
  tailscale-service:
    image: tailscale/tailscale:v1.102.4
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:?Set TAILSCALE_AUTHKEY in .env.tailscale}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: minutes-taker-proxy
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serveconfig.json
      TS_EXPERIMENTAL_SERVICE_AUTO_ADVERTISEMENT: "true"
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro

volumes:
  tailscale-state:
